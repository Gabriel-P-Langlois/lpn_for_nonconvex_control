# Minimal environment for the numerics in this repository.
# Versions are those the results were produced with (python 3.13, torch 2.8,
# numpy 2.3, scipy 1.16); `>=` because nothing here uses a bleeding-edge API.
# CPU-only torch is fine -- the pipeline trains on CPU by design.
#   conda env create -f environment.yml && conda activate lpn_env
name: lpn_env
channels:
  - conda-forge
dependencies:
  - python>=3.10
  - numpy>=2.3
  - scipy>=1.16
  - matplotlib>=3.10
  - pillow>=11.3
  - jupyter
  - pip
  - pip:
      - torch>=2.8
